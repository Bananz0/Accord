# Version catalog.
#
# Added for the vendored Cupertino submodule, whose build script resolves its dependencies through
# `libs.*`. Versions are kept in step with the ones app/build.gradle.kts declares directly, so both
# modules compile against the same AndroidX and Material artifacts.
[versions]
androidx-core = "1.15.0"
androidx-appcompat = "1.7.0"
androidx-fragment = "1.8.6"
material = "1.13.0-alpha11"
hiddenapibypass = "6.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "androidx-fragment" }
material = { module = "com.google.android.material:material", version.ref = "material" }
hiddenapibypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenapibypass" }
