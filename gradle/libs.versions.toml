# Version catalog.
#
# Used by the vendored Cupertino submodule and by the modules carried over from upstream Accord
# (libPhonograph, hificore, misc:*), whose build scripts resolve their dependencies through `libs.*`.
# Versions are kept in step with the ones app/build.gradle.kts declares directly, so every module
# compiles against the same AndroidX and Material artifacts.
[versions]
androidx-core = "1.15.0"
androidx-appcompat = "1.7.0"
androidx-fragment = "1.8.6"
androidx-annotation = "1.9.1"
androidx-lifecycle = "2.9.0-alpha12"
# Raised from 1.6.0-rc01 to what upstream Accord builds against: its player calls APIs that only
# exist from 1.9.0 (Util.putInt24, ShuffleOrder.cloneAndSet, AudioSink.onRoutingChanged, the newer
# buildAudioSink signature), so the ported code does not compile below it. Note the prebuilt
# lib-decoder-ffmpeg AAR in libs/ is still compiled against 1.6.0; nothing references it at compile
# time - ExoPlayer only finds it reflectively - so it wants rebuilding and runtime testing.
media3 = "1.9.0"
kotlinx-coroutines = "1.10.2"
material = "1.13.0-alpha11"
hiddenapibypass = "6.1"
dlfunc = "0.1.6"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "androidx-fragment" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
material = { module = "com.google.android.material:material", version.ref = "material" }
hiddenapibypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenapibypass" }
# Native symbol lookup, consumed by hificore's CMake build as a prefab package.
dlfunc = { module = "io.github.nift4.dlfunc:dlfunc", version.ref = "dlfunc" }
